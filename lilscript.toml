[javascript]
priority = "size-first"
optimization_level = 15
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
candidate_search = "off"
compression = [
  "identifier-mangling",
  "property-mangling",
  "string-pooling",
  "string-array-packing",
]

[mangle]
identifiers = true
properties = true
