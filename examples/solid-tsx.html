<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solid TSX · @itslil/monaco-editor</title>
    <link rel="stylesheet" href="../dist/monaco.css" />
    <style>
      html, body { height: 100%; margin: 0; background: #1e1e1e; }
      #editor { height: 100%; }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module">
      import monaco, { ready } from "../dist/monaco.esm.js"
      await ready
      monaco.editor.create(document.getElementById("editor"), {
        language: "typescript",
        theme: "vs-dark",
        value: `import { For, createSignal } from "solid-js";

export function App() {
  const [items, setItems] = createSignal(["monaco", "solid"]);
  return (
    <main>
      <For each={items()}>{(name: string) => <p>{name}</p>}</For>
      <button type="button" onClick={() => setItems((cur) => [...cur, "tsx"])}>
        add
      </button>
    </main>
  );
}
`,
      })
    </script>
  </body>
</html>
